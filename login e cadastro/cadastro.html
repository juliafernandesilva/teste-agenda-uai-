<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — AgendaUai</title>
<link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/agenda-uai-theme.css">
</head>
<body>
<!-- topo: logo, idioma e lua e sol -->
<header><a class="logo" href="../home/index.html">Agenda<b>Uai</b></a>
 <div class="acoes">
  <!-- botão de idioma -->
  <div class="idioma" id="idioma">
   <button type="button" id="btnIdioma" aria-haspopup="true" aria-expanded="false" data-i18n-title="idiomaTitulo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
    <span id="rotuloIdioma">PT-MG</span>
   </button>
   <ul id="menuIdioma" role="menu" hidden>
    <li><button type="button" role="menuitemradio" data-idioma="br" aria-checked="false">Português Brasil</button></li>
    <li><button type="button" role="menuitemradio" data-idioma="mg" aria-checked="false">Português Mineiro</button></li>
    <li><button type="button" role="menuitemradio" data-idioma="en" aria-checked="false">Inglês (English)</button></li>
   </ul>
  </div>
  <!-- botão lua e sol -->
  <button type="button" class="tema" id="tema" data-i18n-title="temaTitulo">
   <svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
   <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
 </div>
</header>

<!-- o cartão: 3 formulários e o Chico do lado -->
<main>
 <div class="card" id="cartao">

  <!-- criar conta, escondido de começo -->
  <form class="form" id="fc" novalidate hidden>
   <h1 data-i18n="tituloCadastro">Criar conta</h1>
   <p class="sub" data-i18n="subCadastro"></p>

   <!-- contratante ou prestador? -->
   <fieldset class="tipo" id="tipoConta">
    <legend data-i18n="escolhaOpcao"></legend>
    <label class="opcao"><input type="radio" name="tipoConta" value="contratante"><span data-i18n="tipoContratante"></span></label>
    <label class="opcao"><input type="radio" name="tipoConta" value="prestador"><span data-i18n="tipoPrestador"></span></label>
   </fieldset>
   <div class="msg" id="msgTipo"></div>

   <label for="nome" data-i18n="lblNome"></label>
   <div class="campo"><input id="nome" type="text" data-i18n-ph="phNome" autocomplete="name"></div>
   <div class="msg" id="msgNome"></div>

   <label for="emailC" data-i18n="lblEmail"></label>
   <div class="campo"><input id="emailC" type="email" placeholder="seuemail@gmail.com" autocomplete="email"></div>
   <div class="msg" id="msgEmailC"></div>

   <!-- só aparece se for prestador -->
   <div id="blocoDoc" hidden>
    <label for="doc"><span data-i18n="lblDoc"></span><span class="chip" id="chipDoc"></span></label>
    <div class="campo"><input id="doc" type="text" autocapitalize="characters" autocomplete="off" data-i18n-ph="phDoc"></div>
    <div class="msg" id="msgDoc"></div>
    <div class="dica" data-i18n="dicaDoc"></div>
   </div>

   <label for="senhaC" data-i18n="lblSenha"></label>
   <div class="campo"><input id="senhaC" type="password" data-i18n-ph="phSenhaCad" autocomplete="new-password"><button type="button" class="ver" id="verC">Mostrar</button></div>
   <ul class="regras" id="regras">
    <li data-regra="tamanho" data-i18n="regraTamanho"></li>
    <li data-regra="maiuscula" data-i18n="regraMaiuscula"></li>
    <li data-regra="numeroOuEspecial" data-i18n="regraNumEsp"></li>
    <li data-regra="sequencia" data-i18n="regraSeq"></li>
   </ul>
   <div class="msg" id="msgSenhaC"></div>

   <label for="senhaC2" data-i18n="lblConfirmar"></label>
   <div class="campo"><input id="senhaC2" type="password" data-i18n-ph="phConfirmar" autocomplete="new-password"></div>
   <div class="msg" id="msgSenhaC2" style="margin-bottom:12px"></div>

     <!-- TERMOS E POLÍTICA -->
          <div class="aceite">
           <label class="checkbox">
           <input
            type="checkbox"
            name="aceite"
            required>
           <span>
           Li e aceito os
          <a
            href="Termos.html"
            target="_blank">
            Termos de Uso
          </a>
                  e a
          <a
            href="Política.html"
            target="_blank">
           
            Política de Privacidade
          </a>.
       </span>
      </label>
</div>
   
   <button class="entrar" type="submit" data-i18n="btnCriar"></button>
   <p class="criar"><span data-i18n="jaTem"></span> <a href="#" data-ir="login" data-i18n="entrarLink"></a></p>
  </form>

  <!-- o Chico, o JS põe a imagem -->
  <div class="lado"><img id="Chico" alt=""></div>
 </div>
</main>
<footer data-i18n="rodape"></footer>
<script>window.location.replace(new URL("login1510.html?modo=cadastro", window.location.href));</script>
</body>
</html>
